name: Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    name: NuGet Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout cstudio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout DagEdit dependency
        uses: actions/checkout@v6
        with:
          repository: HeaInSeo/DagEdit
          path: external/DagEdit
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-audit-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: nuget-audit-${{ runner.os }}-

      - name: Run restore with NuGet audit
        id: audit
        shell: bash
        run: |
          set +e
          dotnet restore src/CStudio.App/CStudio.App.csproj \
            /p:DagEditProjectPath="$GITHUB_WORKSPACE/external/DagEdit/DagEdit.csproj" \
            /p:NuGetAudit=true \
            /p:NuGetAuditLevel=high \
            > /tmp/cstudio-dependency-audit.txt 2>&1
          RESTORE_EXIT=$?
          set -e

          grep -E '(^|.*/)src/CStudio[^:]*: warning NU190[1-4]' /tmp/cstudio-dependency-audit.txt > /tmp/cstudio-owned-vulns.txt || true

          LOW_COUNT=$(( $(grep -c ": warning NU1901" /tmp/cstudio-owned-vulns.txt 2>/dev/null || true) ))
          MODERATE_COUNT=$(( $(grep -c ": warning NU1902" /tmp/cstudio-owned-vulns.txt 2>/dev/null || true) ))
          HIGH_COUNT=$(( $(grep -c ": warning NU1903" /tmp/cstudio-owned-vulns.txt 2>/dev/null || true) ))
          CRITICAL_COUNT=$(( $(grep -c ": warning NU1904" /tmp/cstudio-owned-vulns.txt 2>/dev/null || true) ))
          TOTAL_COUNT=$((LOW_COUNT + MODERATE_COUNT + HIGH_COUNT + CRITICAL_COUNT))

          echo "low_count=$LOW_COUNT" >> "$GITHUB_OUTPUT"
          echo "moderate_count=$MODERATE_COUNT" >> "$GITHUB_OUTPUT"
          echo "high_count=$HIGH_COUNT" >> "$GITHUB_OUTPUT"
          echo "critical_count=$CRITICAL_COUNT" >> "$GITHUB_OUTPUT"
          echo "total_count=$TOTAL_COUNT" >> "$GITHUB_OUTPUT"
          echo "restore_exit=$RESTORE_EXIT" >> "$GITHUB_OUTPUT"

          if [ -s /tmp/cstudio-owned-vulns.txt ]; then
            echo "cstudio-owned package vulnerabilities:"
            cat /tmp/cstudio-owned-vulns.txt
          else
            echo "No cstudio-owned NuGet vulnerabilities were detected at the configured audit level."
          fi

          if [ "$HIGH_COUNT" -gt 0 ] || [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "High or critical package vulnerabilities detected."
            exit 1
          fi

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cstudio-dependency-audit-log
          path: /tmp/cstudio-dependency-audit.txt
          retention-days: 14

      - name: Upload cstudio vulnerability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cstudio-owned-vulnerabilities
          path: /tmp/cstudio-owned-vulns.txt
          retention-days: 14

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Dependency Audit"
            echo
            echo "| Severity | Count |"
            echo "|---|---:|"
            echo "| Low | ${{ steps.audit.outputs.low_count }} |"
            echo "| Moderate | ${{ steps.audit.outputs.moderate_count }} |"
            echo "| High | ${{ steps.audit.outputs.high_count }} |"
            echo "| Critical | ${{ steps.audit.outputs.critical_count }} |"
            echo "| Total | ${{ steps.audit.outputs.total_count }} |"
            echo
            echo "Policy: high and critical vulnerabilities in cstudio-owned dependency restore paths fail this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
