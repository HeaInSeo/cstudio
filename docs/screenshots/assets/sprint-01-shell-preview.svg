  <text x="392" y="264" fill="#C5CDDB" font-family="Consolas, monospace" font-size="18">CStudio Sprint 01 shell.</text>
  <text x="392" y="300" fill="#C5CDDB" font-family="Consolas, monospace" font-size="18">This screen mirrors the overall information hierarchy</text>
  <text x="392" y="336" fill="#C5CDDB" font-family="Consolas, monospace" font-size="18">of GPU-Reshape Studio while remaining product-neutral.</text>
  <text x="392" y="390" fill="#C5CDDB" font-family="Consolas, monospace" font-size="18">The shell is still mock-backed, but its layout is being shaped</text>
  <text x="392" y="426" fill="#C5CDDB" font-family="Consolas, monospace" font-size="18">so it can later move into DagEdit with less UI churn.</text>

